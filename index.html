<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub 文件上传器</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6e48aa;
            --primary-dark: #4a2d7a;
            --secondary: #9d50bb;
            --light: #f5f7fa;
            --dark: #1e1e2f;
            --success: #4caf50;
            --error: #f44336;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--light) 0%, #e0e5ec 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--dark);
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            overflow: hidden;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            padding: 25px 30px;
            text-align: center;
        }
        
        .header h1 {
            font-weight: 600;
            font-size: 24px;
            margin-bottom: 5px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 14px;
        }
        
        .content {
            padding: 30px;
        }
        
        .upload-area {
            border: 2px dashed #d1d5db;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 25px;
            position: relative;
            background: #f9fafb;
        }
        
        .upload-area:hover {
            border-color: var(--primary);
            background: rgba(110, 72, 170, 0.05);
        }
        
        .upload-area.active {
            border-color: var(--primary);
            background: rgba(110, 72, 170, 0.1);
        }
        
        .upload-area i {
            font-size: 48px;
            color: var(--primary);
            margin-bottom: 15px;
            display: block;
        }
        
        .upload-area h3 {
            font-size: 18px;
            margin-bottom: 10px;
            color: var(--primary);
        }
        
        .upload-area p {
            font-size: 14px;
            color: #6b7280;
        }
        
        .upload-area input {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            opacity: 0;
            cursor: pointer;
        }
        
        .file-info {
            display: none;
            background: #f3f4f6;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            align-items: center;
        }
        
        .file-info.show {
            display: flex;
            animation: fadeIn 0.3s ease;
        }
        
        .file-icon {
            margin-right: 15px;
            color: var(--primary);
            font-size: 24px;
        }
        
        .file-details {
            flex: 1;
        }
        
        .file-name {
            font-weight: 500;
            margin-bottom: 5px;
            word-break: break-all;
        }
        
        .file-size {
            font-size: 12px;
            color: #6b7280;
        }
        
        .remove-file {
            color: #ef4444;
            cursor: pointer;
            margin-left: 15px;
        }
        
        .result {
            display: none;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            animation: fadeIn 0.3s ease;
        }
        
        .result.show {
            display: block;
        }
        
        .result.success {
            background: #f0fdf4;
            border-color: #bbf7d0;
        }
        
        .result.error {
            background: #fef2f2;
            border-color: #fecaca;
        }
        
        .result-title {
            font-weight: 500;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }
        
        .result-title i {
            margin-right: 8px;
        }
        
        .result.success .result-title {
            color: var(--success);
        }
        
        .result.error .result-title {
            color: var(--error);
        }
        
        .result-link {
            display: block;
            margin-top: 10px;
            word-break: break-all;
            color: var(--primary);
            text-decoration: none;
        }
        
        .result-link:hover {
            text-decoration: underline;
        }
        
        .btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .btn:hover {
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--secondary) 100%);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(110, 72, 170, 0.3);
        }
        
        .btn:disabled {
            background: #d1d5db;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .btn i {
            margin-right: 8px;
        }
        
        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }
        
        .loading.show {
            display: block;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            margin: 0 auto;
            border: 4px solid rgba(110, 72, 170, 0.2);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .config-info {
            background: #f3f4f6;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        
        .config-info p {
            margin-bottom: 5px;
        }
        
        .config-info strong {
            color: var(--primary);
        }
        
        .footer {
            text-align: center;
            margin-top: 30px;
            font-size: 12px;
            color: #6b7280;
        }
        
        @media (max-width: 480px) {
            .header {
                padding: 20px 15px;
            }
            
            .content {
                padding: 20px 15px;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-cloud-upload-alt"></i> GitHub 文件上传器</h1>
            <p>轻松上传文件到您的 GitHub 仓库</p>
        </div>
        
        <div class="content">
            <div class="config-info">
                <p>从 <strong>info.json</strong> 加载配置:</p>
                <p id="config-details">正在加载配置信息...</p>
            </div>
            
            <div class="upload-area" id="uploadArea">
                <i class="fas fa-cloud-upload-alt"></i>
                <h3>点击或拖放文件到此处</h3>
                <p>支持单个文件上传 (最大 25MB)</p>
                <input type="file" id="fileInput">
            </div>
            
            <div class="file-info" id="fileInfo">
                <i class="fas fa-file-alt file-icon"></i>
                <div class="file-details">
                    <div class="file-name" id="fileName"></div>
                    <div class="file-size" id="fileSize"></div>
                </div>
                <i class="fas fa-times remove-file" id="removeFile"></i>
            </div>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>正在上传文件到 GitHub...</p>
            </div>
            
            <button class="btn" id="uploadBtn" disabled>
                <i class="fas fa-upload"></i> 上传文件
            </button>
            
            <div class="result" id="result">
                <div class="result-title">
                    <i class="fas fa-check-circle"></i>
                    <span id="resultTitle">上传成功!</span>
                </div>
                <div id="resultMessage"></div>
                <a href="#" target="_blank" class="result-link" id="fileLink"></a>
            </div>
            
            <div class="footer">
                <p>文件将上传到您的 GitHub 仓库根目录，提交信息为文件名</p>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 元素引用
            const uploadArea = document.getElementById('uploadArea');
            const fileInput = document.getElementById('fileInput');
            const fileInfo = document.getElementById('fileInfo');
            const fileName = document.getElementById('fileName');
            const fileSize = document.getElementById('fileSize');
            const removeFile = document.getElementById('removeFile');
            const uploadBtn = document.getElementById('uploadBtn');
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');
            const resultTitle = document.getElementById('resultTitle');
            const resultMessage = document.getElementById('resultMessage');
            const fileLink = document.getElementById('fileLink');
            const configDetails = document.getElementById('config-details');
            
            // 配置信息
            let config = {
                token: '',
                owner: '',
                repo: ''
            };
            
            // 当前选择的文件
            let selectedFile = null;
            
            // 从 info.json 加载配置
            fetch('http://huawen.blog/info.json')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('无法加载 info.json 文件');
                    }
                    return response.json();
                })
                .then(data => {
                    config.token = data.token || '';
                    config.owner = data.owner || '';
                    config.repo = data.repo || '';
                    
                    // 显示配置信息
                    configDetails.innerHTML = `
                        <strong>用户名:</strong> ${config.owner}<br>
                        <strong>仓库名:</strong> ${config.repo}<br>
                        <strong>Token:</strong> ${config.token ? '已配置' : '未配置'}
                    `;
                    
                    if (!config.token || !config.owner || !config.repo) {
                        showError('请在 info.json 中配置 token、owner 和 repo');
                    }
                })
                .catch(error => {
                    console.error('加载配置错误:', error);
                    configDetails.innerHTML = `<span style="color: red;">${error.message}</span>`;
                    showError(error.message);
                });
            
            // 拖放事件处理
            uploadArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadArea.classList.add('active');
            });
            
            uploadArea.addEventListener('dragleave', () => {
                uploadArea.classList.remove('active');
            });
            
            uploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadArea.classList.remove('active');
                
                if (e.dataTransfer.files.length) {
                    handleFileSelect(e.dataTransfer.files[0]);
                }
            });
            
            // 文件选择处理
            fileInput.addEventListener('change', () => {
                if (fileInput.files.length) {
                    handleFileSelect(fileInput.files[0]);
                }
            });
            
            // 移除文件
            removeFile.addEventListener('click', (e) => {
                e.stopPropagation();
                resetFileSelection();
            });
            
            // 上传按钮点击
            uploadBtn.addEventListener('click', uploadFile);
            
            // 处理文件选择
            function handleFileSelect(file) {
                // 检查文件大小 (限制25MB)
                if (file.size > 25 * 1024 * 1024) {
                    showError('文件大小超过25MB限制');
                    return;
                }
                
                selectedFile = file;
                
                // 显示文件信息
                fileName.textContent = file.name;
                fileSize.textContent = formatFileSize(file.size);
                fileInfo.classList.add('show');
                uploadBtn.disabled = false;
                
                // 隐藏结果区域
                result.classList.remove('show');
            }
            
            // 重置文件选择
            function resetFileSelection() {
                selectedFile = null;
                fileInput.value = '';
                fileInfo.classList.remove('show');
                uploadBtn.disabled = true;
                result.classList.remove('show');
            }
            
            // 格式化文件大小
            function formatFileSize(bytes) {
                if (bytes === 0) return '0 Bytes';
                
                const k = 1024;
                const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            }
            
            // 上传文件到GitHub
            function uploadFile() {
                if (!selectedFile || !config.token || !config.owner || !config.repo) {
                    showError('请选择文件并确保配置正确');
                    return;
                }
                
                // 显示加载状态
                loading.classList.add('show');
                uploadBtn.disabled = true;
                
                // 读取文件内容
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    const content = e.target.result;
                    const base64Content = btoa(unescape(encodeURIComponent(content)));
                    
                    // 准备API请求
                    const apiUrl = `https://api.github.com/repos/${config.owner}/${config.repo}/contents/${selectedFile.name}`;
                    const headers = {
                        'Authorization': `token ${config.token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    };
                    
                    const body = {
                        message: selectedFile.name, // 提交信息为文件名
                        content: base64Content
                    };
                    
                    // 发送请求
                    fetch(apiUrl, {
                        method: 'PUT',
                        headers: headers,
                        body: JSON.stringify(body)
                    })
                    .then(response => response.json())
                    .then(data => {
                        loading.classList.remove('show');
                        
                        if (data.content) {
                            // 上传成功
                            const fileUrl = `https://${config.owner}.github.io/${config.repo}/${selectedFile.name}`;
                            
                            result.className = 'result show success';
                            resultTitle.innerHTML = '<i class="fas fa-check-circle"></i> 上传成功!';
                            resultMessage.textContent = '文件已成功上传到 GitHub 仓库。';
                            fileLink.href = fileUrl;
                            fileLink.textContent = fileUrl;
                            
                            // 复制链接到剪贴板
                            navigator.clipboard.writeText(fileUrl).then(() => {
                                resultMessage.textContent += ' (链接已复制到剪贴板)';
                            });
                        } else {
                            // 上传失败
                            showError(data.message || '上传文件到 GitHub 失败');
                        }
                    })
                    .catch(error => {
                        loading.classList.remove('show');
                        showError(error.message);
                    });
                };
                
                reader.onerror = function() {
                    loading.classList.remove('show');
                    showError('读取文件失败');
                };
                
                if (selectedFile.type && selectedFile.type.match('text.*')) {
                    reader.readAsText(selectedFile);
                } else {
                    reader.readAsBinaryString(selectedFile);
                }
            }
            
            // 显示错误信息
            function showError(message) {
                result.className = 'result show error';
                resultTitle.innerHTML = '<i class="fas fa-exclamation-circle"></i> 错误';
                resultMessage.textContent = message;
                fileLink.href = '#';
                fileLink.textContent = '';
            }
        });
    </script>
</body>
  </html>
